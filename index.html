<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Onroad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" />
  <style>
    /* only what the page needs before the JS (and src/ui.css) loads */
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #ededed; font: 14px/1.4 "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    canvas#c { display: block; width: 100vw; height: 100vh; cursor: grab; touch-action: none; }
    canvas#c:active { cursor: grabbing; }
    [hidden] { display: none !important; }
    #loading { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: #000; transition: opacity .5s ease; }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading .ld-box { width: min(280px, calc(100vw - 48px)); text-align: center; }
    #loading .ld-title { font: 600 22px/1.1 "Geist", ui-sans-serif, system-ui, sans-serif; letter-spacing: -.03em; }
    #loading .ld-bar { height: 2px; margin: 20px 0 10px; border-radius: 1px; background: rgba(255,255,255,.1); overflow: hidden; }
    #loading .ld-bar i { display: block; height: 100%; background: #ededed; transform-origin: 0 50%; transform: scaleX(var(--p, .04)); transition: transform .3s ease; }
    #loading .ld-t { color: #a1a1a1; font-size: 12.5px; min-height: 1.4em; }
    #loading.error .ld-bar i { background: #ff5a45; }
    #loading .ld-err { margin-top: 14px; padding: 12px 14px; border-radius: 10px; background: rgba(255,77,77,.08); border: 1px solid rgba(255,77,77,.3); color: #ffd2cb; font-size: 13px; line-height: 1.5; text-align: left; }
    #loading .ld-err button { margin-top: 10px; height: 32px; padding: 0 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08); color: #fff; font: 600 13px/1 inherit; cursor: pointer; }
    #loading noscript { display: block; margin-top: 14px; color: #ffd2cb; }
  </style>
</head>
<body>
  <canvas id="c" aria-label="Game view"></canvas>
  <div id="hud"></div>
  <div id="menu" class="overlay" hidden></div>
  <div id="loading" role="status" aria-live="polite">
    <div class="ld-box">
      <div class="ld-title">Onroad</div>
      <div class="ld-bar"><i></i></div>
      <div class="ld-t">Loading…</div>
      <div class="ld-err" hidden></div>
      <noscript>This game needs JavaScript.</noscript>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
